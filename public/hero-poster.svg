<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080" role="img" aria-label="Frame inicial del video hero AI-MaX">
  <defs>
    <radialGradient id="hero-grad" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#0D2A6B"/>
      <stop offset="55%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#06101F"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#0066FF" stroke-width="1" stroke-opacity="0.10"/>
    </pattern>
    <radialGradient id="glow-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-red" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11B22" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E11B22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#hero-grad)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Glows ambientales -->
  <circle cx="380" cy="300" r="440" fill="url(#glow-blue)"/>
  <circle cx="1620" cy="820" r="380" fill="url(#glow-red)"/>

  <!-- Waveform central sutil (telegrafía del hero) -->
  <g transform="translate(960 540)" stroke="#0066FF" stroke-opacity="0.35" stroke-linecap="round" fill="none">
    <path d="M -320 0 L -320 -12 M -280 0 L -280 -32 M -240 0 L -240 -64 M -200 0 L -200 -96 M -160 0 L -160 -128 M -120 0 L -120 -100 M -80 0 L -80 -72 M -40 0 L -40 -44 M 0 0 L 0 -118 M 40 0 L 40 -76 M 80 0 L 80 -52 M 120 0 L 120 -88 M 160 0 L 160 -120 M 200 0 L 200 -96 M 240 0 L 240 -64 M 280 0 L 280 -32 M 320 0 L 320 -14" stroke-width="3"/>
    <path d="M -320 0 L -320 12 M -280 0 L -280 32 M -240 0 L -240 64 M -200 0 L -200 96 M -160 0 L -160 128 M -120 0 L -120 100 M -80 0 L -80 72 M -40 0 L -40 44 M 0 0 L 0 118 M 40 0 L 40 76 M 80 0 L 80 52 M 120 0 L 120 88 M 160 0 L 160 120 M 200 0 L 200 96 M 240 0 L 240 64 M 280 0 L 280 32 M 320 0 L 320 14" stroke-width="3"/>
  </g>

  <!-- Anillo cónico central (eco del AnimatedLogo) -->
  <circle cx="960" cy="540" r="280" fill="none" stroke="#003DA5" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 8"/>
  <circle cx="960" cy="540" r="340" fill="none" stroke="#E11B22" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="2 12"/>

  <!-- Etiquetas técnicas (سينما VFX) -->
  <text x="64" y="80" font-family="JetBrains Mono, monospace" font-size="13" fill="#6FB1FF" opacity="0.7" letter-spacing="2.5">AI-MaX · HERO LOOP</text>
  <text x="64" y="100" font-family="JetBrains Mono, monospace" font-size="13" fill="#6FB1FF" opacity="0.5" letter-spacing="2.5">CALL 24/7 · ANALYZE · ORCHESTRATE</text>
  <text x="1856" y="1040" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="13" fill="#E11B22" opacity="0.7" letter-spacing="2.5">VEO 3.1 · 1920×1080</text>
</svg>
